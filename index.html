<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#f6f3ef">
<title>头顶西兰花的小世界</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%208%208'%3E%3Crect%20width='8'%20height='8'%20fill='%23f6f3ef'/%3E%3Crect%20x='2'%20y='1'%20width='4'%20height='4'%20fill='%23211b16'/%3E%3Crect%20x='1'%20y='5'%20width='6'%20height='2'%20fill='%23e0963a'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#f6f3ef;
    --panel:#ffffff;
    --panel-2:#f1ede7;
    --ink:#1d1a17;
    --ink-2:#514a43;
    --muted:#8d857b;
    --line:#eae4dc;
    --dark:#211b16;
    --dark-2:#2b241e;
    --dark-ink:#f7f3ec;
    --dark-muted:#a99e92;
    --accent:#e0963a;
    --accent-soft:#fdf3e3;
    --radius:18px;
    --shadow:0 12px 34px -22px rgba(30,22,15,.45);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);color:var(--ink);-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;
    font:15px/1.7 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Helvetica Neue","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  button{font:inherit;color:inherit;cursor:pointer}

  /* ---------- 左侧导航 ---------- */
  .app-shell{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
  .sidenav{
    position:sticky;top:0;height:100vh;z-index:30;display:flex;flex-direction:column;gap:14px;
    padding:20px 14px 14px;background:var(--panel);border-right:1px solid var(--line);overflow:auto;
  }
  .brand{display:flex;align-items:center;gap:11px;padding:0 6px}
  .brand-text{min-width:0}
  .brand-name{font-size:15px;font-weight:700;line-height:1.35;letter-spacing:-.01em}
  .brand-sub{font-size:12.5px;color:var(--muted);margin-top:3px}
  .mascot{flex:none;width:44px;height:44px;border-radius:15px;background:var(--panel-2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;overflow:hidden}
  .mascot svg{width:36px;height:36px;display:block}
  .nav{display:flex;flex-direction:column;gap:3px}
  .nav-item{
    display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;
    border-radius:12px;padding:7px 10px;font-size:14.5px;color:var(--ink-2);text-align:left;
    transition:background .15s,color .15s;
  }
  .nav-item:hover{background:var(--panel-2)}
  .nav-item.is-active{background:var(--dark);color:var(--dark-ink)}
  .nav-item.is-active .nav-ico{background:rgba(255,255,255,.16);color:var(--dark-ink)}
  .nav-ico{
    flex:none;width:26px;height:26px;border-radius:9px;background:var(--panel-2);color:var(--ink-2);
    display:flex;align-items:center;justify-content:center;font-size:12.5px;
  }
  .nav-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);margin-left:auto}
  .side-foot{
    margin-top:auto;display:flex;flex-direction:column;gap:9px;
    padding:14px 8px 2px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);
  }
  .foot-actions{display:flex;gap:14px}
  .link-btn{border:0;background:transparent;color:var(--muted);font-size:12.5px;padding:0}
  .link-btn:hover{color:var(--ink)}

  /* ---------- 内容分带 ---------- */
  main{width:100%}
  .band{width:100%}
  .band-inner{max-width:760px;margin:0 auto;padding:26px 20px}
  .band.dark{background:var(--dark);color:var(--dark-ink)}
  .band.dark .band-inner{padding:30px 20px}
  .band.soft{background:var(--panel-2)}
  .band-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:16px}
  .band-head h2{margin:0;font-size:19px;font-weight:700;letter-spacing:-.01em}
  .band-meta{font-size:13px;color:var(--muted);white-space:nowrap}
  .band.dark .band-meta{color:var(--dark-muted)}

  /* ---------- 首页 ---------- */
  .poem{margin:2px 0 18px;text-align:center;color:var(--muted);font-size:13.5px}
  .hero{position:relative;border-radius:22px;overflow:hidden;background:#f3e7d3;box-shadow:var(--shadow)}
  .hero-media{display:block;width:100%;border:0;padding:0;background:transparent;position:relative}
  .hero-media svg{display:block;width:100%;height:auto}
  .hero-media:active svg{transform:scale(.995)}
  .hero-cap{position:absolute;left:14px;bottom:12px;background:rgba(29,26,23,.62);color:#fff;font-size:12.5px;padding:5px 11px;border-radius:999px;backdrop-filter:blur(4px)}
  .hero-bubble{
    position:absolute;left:50%;top:16px;transform:translateX(-50%);
    background:#fff;color:var(--ink);font-size:14px;padding:9px 16px;border-radius:999px;box-shadow:0 8px 24px -14px rgba(0,0,0,.5);
    animation:pop .22s ease-out;
  }
  @keyframes pop{from{transform:translate(-50%,6px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
  .hint-center{margin:12px 0 0;text-align:center;font-size:12.5px;color:var(--muted)}

  .action-title{margin:0;font-size:19px;font-weight:700}
  .action-body{margin:8px 0 0;color:var(--dark-muted);font-size:14px}
  .rows{margin:16px 0 0}
  .rowline{display:flex;align-items:flex-start;gap:12px;padding:13px 0;border-top:1px solid rgba(255,255,255,.09)}
  .rowline:first-child{border-top:0}
  .rowline .rl-main{flex:1;min-width:0}
  .rowline .rl-title{font-size:14.5px}
  .rowline .rl-meta{margin-top:3px;font-size:12.5px;color:var(--dark-muted)}
  .pill-btn{
    display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
    border:0;border-radius:999px;padding:15px 22px;font-size:15px;font-weight:600;margin-top:18px;
    background:var(--dark-ink);color:var(--dark);box-shadow:0 10px 28px -18px rgba(0,0,0,.6);
  }
  .pill-btn:hover{filter:brightness(.97)}
  .pill-btn:active{transform:translateY(1px)}
  .pill-btn.small{width:auto;padding:10px 18px;font-size:14px;margin-top:0}
  .pill-btn.line{background:transparent;color:var(--dark-ink);border:1px solid rgba(255,255,255,.28);box-shadow:none}
  .light .pill-btn, .band:not(.dark) .pill-btn{background:var(--dark);color:var(--dark-ink)}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{
    border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 13px;font-size:13px;color:var(--ink-2);
  }
  .chip b{font-weight:600;color:var(--ink)}
  .chip.accent{background:var(--accent-soft);border-color:#f2e2c8}
  .rows.light .rowline{border-top:1px solid var(--line)}
  .rows.light .rowline .rl-meta{color:var(--muted)}
  .navrow{display:flex;align-items:center;gap:12px;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:15px 16px;margin-top:10px;text-align:left}
  .navrow:hover{border-color:#ded6cb}
  .navrow .nr-ico{font-size:17px;width:22px;text-align:center;flex:none}
  .navrow .nr-main{flex:1;min-width:0}
  .navrow .nr-title{font-size:14.5px;font-weight:600}
  .navrow .nr-meta{font-size:12.5px;color:var(--muted);margin-top:2px}
  .navrow .nr-arrow{color:var(--muted);font-size:15px;flex:none}
  .bars{margin-top:12px}
  .barrow{display:flex;align-items:center;gap:10px;padding:5px 0}
  .barrow .bl{width:104px;flex:none;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bar{flex:1;height:7px;border-radius:999px;background:#ece6de;overflow:hidden}
  .bar > i{display:block;height:100%;border-radius:999px;background:var(--accent)}
  .barrow .bv{width:34px;flex:none;text-align:right;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}

  /* ---------- 顶部大图(铺满) ---------- */
  .hero-full{position:relative;width:100%;background:#eae4dc}
  .hero-full img{display:block;width:100%;height:clamp(240px,44vw,520px);object-fit:cover}
  .hero-hit{position:absolute;inset:0;border:0;background:transparent;cursor:pointer}
  .hero-cap{position:absolute;left:18px;bottom:16px;background:rgba(29,26,23,.55);color:#fff;font-size:12.5px;padding:6px 12px;border-radius:999px;backdrop-filter:blur(4px)}
  .hero-bubble{
    position:absolute;left:50%;top:18px;transform:translateX(-50%);
    background:#fff;color:var(--ink);font-size:14px;padding:10px 18px;border-radius:999px;
    box-shadow:0 12px 30px -18px rgba(0,0,0,.6);animation:pop .22s ease-out;
  }
  /* ---------- 轮播 ---------- */
  .carousel{position:relative;margin:4px 0 0}
  .slides{position:relative;border-radius:20px;overflow:hidden;box-shadow:var(--shadow)}
  .slide{display:none;margin:0}
  .slide.is-active{display:block}
  .slide svg{display:block;width:100%;height:auto}
  .slide figcaption{padding:12px 14px 14px;font-size:13.5px;color:var(--dark-muted)}
  .cbtn{
    position:absolute;top:calc(50% - 34px);transform:translateY(-50%);
    width:38px;height:38px;border-radius:50%;border:0;background:rgba(29,26,23,.45);color:#fff;font-size:18px;line-height:1;
    display:flex;align-items:center;justify-content:center;backdrop-filter:blur(3px);
  }
  .cbtn:hover{background:rgba(29,26,23,.68)}
  .cbtn.prev{left:12px}
  .cbtn.next{right:12px}
  .dots{display:flex;gap:7px;justify-content:center;margin-top:14px}
  .dots button{width:7px;height:7px;padding:0;border-radius:50%;border:0;background:rgba(255,255,255,.35)}
  .dots button.is-active{background:var(--accent);width:18px;border-radius:999px}

  .slide img{display:block;width:100%;height:auto}
  .slide figcaption{padding:12px 2px 0;font-size:13px;color:var(--muted)}
  .dots button{background:#ddd5cb}
  .dots button.is-active{background:var(--accent)}
  /* ---------- 其它页面 ---------- */
  .page-head{margin:4px 0 18px}
  .page-head h2{margin:0;font-size:22px;font-weight:700;letter-spacing:-.01em}
  .page-head p{margin:6px 0 0;color:var(--muted);font-size:13.5px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
  .card + .card{margin-top:14px}
  .card h3{margin:0 0 12px;font-size:14px;font-weight:700;color:var(--ink-2)}
  form .fr,form.fr{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
  form .fr + .fr{margin-top:9px}
  input[type=text],input[type=date],input[type=time],input[type=number],select,textarea{
    font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0;
  }
  textarea{resize:vertical;line-height:1.7;width:100%}
  input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  ::placeholder{color:#b3aaa0}
  .grow{flex:1 1 170px}
  .btn{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:9px 17px;font-size:14px;color:var(--ink-2)}
  .btn:hover{border-color:#ddd5cb;background:var(--panel-2)}
  .btn.primary{background:var(--dark);border-color:var(--dark);color:var(--dark-ink);font-weight:600}
  .btn.primary:hover{filter:brightness(1.1)}
  .btn.tiny{padding:4px 10px;font-size:12.5px;border-radius:999px;background:transparent;border-color:transparent;color:var(--muted)}
  .btn.tiny:hover{background:var(--panel-2);color:var(--ink)}
  .list{list-style:none;margin:0;padding:0}
  .list > li{display:flex;gap:12px;align-items:flex-start;padding:14px 0;border-top:1px solid var(--line)}
  .list > li:first-child{border-top:0;padding-top:2px}
  .li-main{flex:1;min-width:0}
  .li-title{font-size:14.5px;line-height:1.6;word-break:break-word}
  .li-meta{margin-top:5px;display:flex;flex-wrap:wrap;gap:7px;align-items:center;font-size:12.5px;color:var(--muted)}
  .li-actions{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;flex:none}
  .tag{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:12px;background:var(--panel-2);color:var(--ink-2);border:1px solid var(--line);white-space:nowrap}
  button.tag{cursor:pointer}
  .tag.amber{background:var(--accent-soft);border-color:#f0e0c6;color:#9a6a22}
  .tag.dark{background:var(--dark);border-color:var(--dark);color:var(--dark-ink)}
  .tag.green{background:#eaf3ea;border-color:#dcebdc;color:#4c7a51}
  .swatch{width:8px;height:8px;border-radius:2px;flex:none}
  .swatch.p1{background:#c98a3c}
  .swatch.p2{background:#7f8f7a}
  .swatch.p3{background:#a98f6a}
  .empty{color:var(--muted);font-size:13.5px;padding:6px 0}
  .subtle{color:var(--muted);font-size:12.5px}
  details.guide{border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);padding:16px 18px}
  details.guide summary{cursor:pointer;font-size:14px;font-weight:600}
  details.guide ol{margin:12px 0 0;padding-left:20px;color:var(--ink-2);font-size:13.5px}
  details.guide li{margin:7px 0}
  .week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
  .day{border:1px solid var(--line);border-radius:14px;background:var(--panel);padding:10px;min-height:96px}
  .day.today{border-color:#e8cfa4;background:var(--accent-soft)}
  .day .dn{font-size:12.5px;font-weight:600}
  .day .dd{font-size:11.5px;color:var(--muted);margin-top:1px}
  .day .slot{margin-top:8px;font-size:12.5px;color:var(--ink-2);line-height:1.5}
  .day .slot .tm{display:block;color:var(--muted);font-size:11.5px}
  .track{border:1px solid var(--line);border-radius:16px;background:var(--panel);padding:16px}
  .track + .track{margin-top:12px}
  .track .t-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
  .track .t-name{font-size:14.5px;font-weight:600}
  .track .t-goal{font-size:12.5px;color:var(--muted);margin-top:2px}
  .track .t-pct{font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums}
  .track-progress{display:flex;align-items:center;gap:12px;margin-top:12px;flex-wrap:wrap}
  .track-progress .bar{flex:1 1 160px;min-width:120px}
  .t-count{font-size:13px;color:var(--muted);white-space:nowrap}
  .t-count b{font-size:22px;font-weight:700;color:var(--ink);margin-right:2px}
  .pct-box{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);white-space:nowrap}
  .pct-box input{width:74px;text-align:center;padding:7px 6px}
  .track input[type=range]{--pct:0%;width:100%;margin:12px 0 2px;appearance:none;-webkit-appearance:none;height:7px;border-radius:999px;background:linear-gradient(90deg,var(--accent) var(--pct),#ece6de var(--pct));border:0}
  .track input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#fff;border:2px solid var(--accent);box-shadow:0 2px 6px rgba(0,0,0,.15)}
  .track input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#fff;border:2px solid var(--accent)}
  .entry{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line);font-size:13px}
  .entry .when{color:var(--muted);white-space:nowrap;flex:none}
  .entry .txt{flex:1;min-width:0}
  .flash{animation:flashbg 1.4s ease-out 1}
  @keyframes flashbg{from{background:var(--accent-soft)}to{background:transparent}}
  .toast{
    position:fixed;left:50%;bottom:26px;transform:translate(-50%,12px);opacity:0;pointer-events:none;
    background:var(--dark);color:var(--dark-ink);font-size:13.5px;padding:11px 18px;border-radius:999px;
    box-shadow:0 14px 30px -16px rgba(0,0,0,.6);transition:opacity .18s ease,transform .18s ease;z-index:60;max-width:82vw;text-align:center;
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .menu{
    position:absolute;right:20px;top:60px;z-index:40;background:var(--panel);border:1px solid var(--line);border-radius:14px;
    box-shadow:0 18px 40px -22px rgba(0,0,0,.5);padding:8px;min-width:170px;
  }
  .menu button{display:block;width:100%;text-align:left;border:0;background:transparent;border-radius:10px;padding:10px 12px;font-size:14px;color:var(--ink-2)}
  .menu button:hover{background:var(--panel-2)}
  .cf-modal[hidden],.qr-modal[hidden]{display:none !important}
  .cf-modal{position:fixed;inset:0;z-index:85;background:rgba(30,22,15,.5);display:flex;align-items:center;justify-content:center;padding:24px}
  .cf-card{background:var(--panel);border-radius:18px;padding:20px;max-width:320px;width:100%;box-shadow:0 30px 60px -30px rgba(0,0,0,.6)}
  .cf-card p{margin:0 0 16px;font-size:14.5px;text-align:center}
  .cf-actions{display:flex;gap:10px}
  .cf-actions .btn{flex:1}
  .qr-modal{position:fixed;inset:0;z-index:80;background:rgba(30,22,15,.5);display:flex;align-items:center;justify-content:center;padding:24px}
  .qr-card{background:var(--panel);border-radius:20px;padding:22px;max-width:320px;width:100%;text-align:center;box-shadow:0 30px 60px -30px rgba(0,0,0,.6)}
  .qr-card h3{margin:0 0 14px;font-size:16px}
  .qr-target{display:flex;align-items:center;justify-content:center;min-height:220px}
  .qr-target img,.qr-target canvas{display:block}
  .qr-url{margin:14px 0 0;font-size:12px;color:var(--ink-2);word-break:break-all}
  .qr-hint{margin:6px 0 14px;font-size:12px;color:var(--muted)}
  .preview-strip{background:var(--accent-soft);color:#8a5a18;font-size:12.5px;text-align:center;padding:7px 12px}
  .foot-note{color:var(--muted);font-size:12.5px;text-align:center;padding:8px 0 0}


  .navrow .nr-title{display:block;font-size:14.5px;font-weight:600}
  .navrow .nr-meta{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
  .band.dark .rowline .btn.tiny{color:var(--dark-muted)}
  .band.dark .rowline .btn.tiny:hover{background:rgba(255,255,255,.08);color:var(--dark-ink)}
  .band.dark .tag{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.16);color:var(--dark-ink)}
  .band.dark .tag.amber{background:rgba(224,150,58,.18);border-color:rgba(224,150,58,.35);color:#f0c184}
  .band:not(.dark) .pill-btn.line{background:transparent;border-color:#ded6cb;color:var(--ink-2)}
  .band:not(.dark) .pill-btn.line:hover{background:var(--panel-2)}

  @media (max-width:820px){
    .band-inner{padding:22px 16px}
  }
  @media (max-width:900px){
    .app-shell{grid-template-columns:minmax(0,1fr)}
    main{min-width:0}
    .sidenav{position:static;height:auto;overflow:visible;border-right:0;border-bottom:1px solid var(--line);padding:12px 14px 10px;gap:10px}
    .brand{padding:0 2px}
    .mascot{width:38px;height:38px;border-radius:13px}
    .mascot svg{width:31px;height:31px}
    .brand-name{font-size:14.5px}
    .brand-sub{font-size:12px;margin-top:1px}
    .nav{
      flex-direction:row;flex-wrap:nowrap;gap:7px;overflow-x:auto;scrollbar-width:none;
      position:sticky;top:0;z-index:25;background:var(--panel);margin:0 -14px;padding:8px 14px;border-bottom:1px solid var(--line);
    }
    .nav::-webkit-scrollbar{display:none}
    .nav-item{width:auto;flex:none;border-radius:999px;padding:7px 13px 7px 8px;background:var(--panel-2);min-height:40px;touch-action:manipulation}
    .nav-item.is-active{background:var(--dark)}
    .nav-ico{width:22px;height:22px;border-radius:8px;font-size:11.5px;background:transparent}
    .side-foot{margin-top:0;flex-direction:row;align-items:center;justify-content:space-between;border-top:0;padding:0 2px;font-size:11.5px}
    .link-btn{font-size:12px;min-height:32px}
    main{padding-bottom:calc(28px + env(safe-area-inset-bottom))}
    input[type=text],input[type=date],input[type=time],input[type=number],select,textarea{font-size:16px;min-height:44px}
    textarea{min-height:0}
    .btn{min-height:40px}
    .pill-btn{padding:16px 22px}
    .li-actions .btn.tiny,.li-actions .btn.small{min-height:32px}

  function uid(p) { seq += 1; return p + "-" + Date.now().toString(36) + "-" + seq; }
  function pad2(n) { return String(n).padStart(2, "0"); }
  function isoOf(d) { return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()); }
  function todayISO() { return isoOf(new Date()); }
  function parseISO(s) { var p = String(s).split("-").map(Number); return new Date(p[0], p[1] - 1, p[2]); }
  function fmtCN(s) { var d = parseISO(s); return (d.getMonth() + 1) + "月" + d.getDate() + "日"; }
  function fmtShort(s) { var d = parseISO(s); return (d.getMonth() + 1) + "/" + d.getDate(); }
  function fmtWD(s) { return WD[parseISO(s).getDay()]; }
  function addDays(iso, n) { var d = parseISO(iso); d.setDate(d.getDate() + n); return isoOf(d); }
  function nextWD(target) {
    var d = new Date();
    d.setDate(d.getDate() + 1);
    while (d.getDay() !== target) { d.setDate(d.getDate() + 1); }
    return isoOf(d);
  }
  function startOfWeekISO() {
    var d = new Date(); var day = d.getDay();
    d.setDate(d.getDate() + (day === 0 ? -6 : 1 - day));
    return isoOf(d);
  }
  var ESC_MAP = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" };

  function byDate(a, b) { return String(a.date + a.time).localeCompare(String(b.date + b.time)); }

  function seed() {
    var t1 = uid("t"), t5 = uid("t");

      topics: [

        { id: uid("t"), title: "普通人攒「看世界」资料库的笨办法", pillar: "ideal", status: "idea", source: "" },
        { id: uid("t"), title: "英语重启计划:不为考试,只为有一天能出去聊项目", pillar: "ideal", status: "idea", source: "" },
        { id: uid("t"), title: "每月存 500:「看世界基金」的第一笔", pillar: "ideal", status: "idea", source: "" },
        { id: t5, title: "深圳周末徒步:第一次走完鲲鹏径的一段", pillar: "weekend", status: "scheduled", source: "起点选题" },

        { id: uid("t"), title: "读完一本讲「慢慢生活」的书,我想通了一件事", pillar: "paper", status: "idea", source: "" },
        { id: uid("t"), title: "我为什么重新开始写书评", pillar: "paper", status: "idea", source: "" }
      ],
      schedule: [
        { id: uid("s"), topicId: t1, title: "刚毕业的第一年,我给自己列了 5 条「理想进度条」", date: nextWD(3), time: "21:00", done: false },
        { id: uid("s"), topicId: t5, title: "深圳周末徒步:第一次走完鲲鹏径的一段", date: nextWD(0), time: "18:30", done: false }
      ],
      tracks: [
        { id: uid("k"), name: "英语", goal: "能读懂英文资料,敢开口聊项目", target: 30, entries: [] },
        { id: uid("k"), name: "项目管理", goal: "能独立带好一个小项目", target: 20, entries: [] },

        { id: uid("k"), name: "储蓄", goal: "存下第一笔「看世界基金」", target: 12, entries: [] }
      ],
      weekend: [],
      books: []
    };
  }

  var data = null;
  try {
    var raw = PREVIEW ? null : window.localStorage.getItem(KEY);
    if (raw) { data = JSON.parse(raw); }
  } catch (err) { data = null; }
  if (!data || data.version !== 1 || !Array.isArray(data.topics)) { data = seed(); }

  var storageOK = true;
  try {
    window.localStorage.setItem("ipgw.check", "1");
    window.localStorage.removeItem("ipgw.check");
  } catch (err) { storageOK = false; }

  var currentView = "today";
  var topicFilter = "all";
  var pendingScheduleTopicId = "";
  var flashId = "";
  var slideIndex = 0;
  var expanded = {};
  var toastTimer = null;
  var savedAt = "";

  function toast(msg) {
    var el = $("#toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove("show"); }, 2600);
  }

  var SYNC = { mode: "local", timer: null, last: "" };

  function renderSyncNote() {
    var el = document.getElementById("syncNote");
    if (!el) { return; }
    if (PREVIEW) { el.textContent = "预览模式 · 改动不会保存"; return; }
    if (SYNC.mode === "server") {
      el.textContent = SYNC.last ? "已同步到电脑 · " + SYNC.last : "已连上电脑 · 改动会自动同步";
    } else {
      el.textContent = "数据只存在这台电脑上";
    }
  }

  function pushServer() {
    if (SYNC.mode !== "server" || PREVIEW) { return; }
    fetch("./api/data", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(data)
    }).then(function (r) { return r.json(); }).then(function (j) {
      if (j && j.ok) {
        lastPulled = JSON.stringify(data);
        SYNC.last = new Date().toLocaleTimeString("zh-CN", { hour: "2-digit", minute: "2-digit" });
        renderSyncNote();
      }
    }).catch(function () {
      toast("同步失败:检查手机和电脑是不是同一个 Wi-Fi");
    });
  }

  function save() {
    if (PREVIEW) { return; }
    try {
      window.localStorage.setItem(KEY, JSON.stringify(data));
    } catch (err) { /* 本地存不了就算了,同步模式下以电脑上的数据为准 */ }
    if (SYNC.mode === "server") {
      SYNC.last = "";
      renderSyncNote();
      clearTimeout(SYNC.timer);
      SYNC.timer = setTimeout(pushServer, 350);
    }
  }

  var lastPulled = "";

  function pullServer() {
    if (SYNC.mode !== "server" || PREVIEW) { return; }
    fetch("./api/data", { cache: "no-store" }).then(function (r) { return r.json(); }).then(function (j) {
      if (j && j.ok && j.data && j.data.version === 1) {
        var str = JSON.stringify(j.data);
        if (str !== lastPulled) {
          lastPulled = str;
          data = j.data;
          refresh();
        }
      }
    }).catch(function () {});
  }

  document.addEventListener("visibilitychange", function () { if (!document.hidden) { pullServer(); } });
  window.addEventListener("focus", pullServer);

  function initSync() {
    var qb = document.getElementById("qrBtn");
    if (location.protocol !== "http:" && location.protocol !== "https:") { renderSyncNote(); return; }
    fetch("./api/data", { cache: "no-store" }).then(function (r) {
      if (!r.ok) { throw new Error("no api"); }
      return r.json();
    }).then(function (j) {
      if (!j || !j.ok) { throw new Error("bad api"); }
      SYNC.mode = "server";
      if (qb) { qb.hidden = false; }
      if (j.data && j.data.version === 1) {
        data = j.data;
        migrate();
        lastPulled = JSON.stringify(j.data);
        renderSyncNote();
        refresh();
      } else {
        renderSyncNote();
        pushServer();
      }
    }).catch(function () {
      SYNC.mode = "local";
      renderSyncNote();
    });
  }

  function migrate() {
    if (!data || !Array.isArray(data.tracks)) { return; }
    data.tracks.forEach(function (t) {
      if (typeof t.target !== "number" || t.target <= 0) { t.target = 20; }
      if (!Array.isArray(t.entries)) { t.entries = []; }
    });
  }

  function trackCount(t) { return (t.entries || []).length; }
  function trackTarget(t) { return (t.target > 0) ? t.target : 20; }
  function trackPct(t) { return Math.max(0, Math.min(100, Math.round(trackCount(t) / trackTarget(t) * 100))); }
  function totalEntries() { var n = 0; data.tracks.forEach(function (t) { n += trackCount(t); }); return n; }

  function countTopics() {
    var c = { idea: 0, drafting: 0, scheduled: 0, published: 0 };
    data.topics.forEach(function (t) { if (c[t.status] != null) { c[t.status] += 1; } });
    return c;
  }
  function addTopic(title, pillar, source) {
    var t = {
      id: uid("t"),
      title: String(title || "").slice(0, 80),
      pillar: PILLARS[pillar] ? pillar : "ideal",
      status: "idea",
      source: source || ""
    };
    data.topics.unshift(t);
    flashId = t.id;
    return t;
  }
  function findTopic(id) { var o = null; data.topics.forEach(function (t) { if (t.id === id) { o = t; } }); return o; }
  function findSchedule(id) { var o = null; data.schedule.forEach(function (s) { if (s.id === id) { o = s; } }); return o; }
  function findTrack(id) { var o = null; data.tracks.forEach(function (t) { if (t.id === id) { o = t; } }); return o; }
  function findWeekend(id) { var o = null; data.weekend.forEach(function (w) { if (w.id === id) { o = w; } }); return o; }
  function findBook(id) { var o = null; data.books.forEach(function (b) { if (b.id === id) { o = b; } }); return o; }

  function go(view) {
    currentView = view;
    ["today", "topics", "schedule", "ideal", "weekend", "paper"].forEach(function (v) {
      var el = document.getElementById("view-" + v);
      if (el) { el.hidden = v !== view; }
    });

      b.classList.toggle("is-active", b.getAttribute("data-view") === view);

  function refresh() {
    renderSub();
    renderToday();
    renderTopics();
    renderSchedule();
    renderIdeal();
    renderWeekend();
    renderPaper();
  }

  function renderSub() {
    var now = new Date();

  function avgProgress() {
    if (!data.tracks.length) { return 0; }
    var sum = 0;
    data.tracks.forEach(function (t) { sum += Math.max(0, Math.min(100, t.progress)); });
    return Math.round(sum / data.tracks.length);
  }

  function bindHero() {
    var btn = $("#heroBtn");
    var bubble = $("#heroBubble");
    if (!btn || !bubble) { return; }
    btn.addEventListener("click", function () {
      bubble.textContent = GENTLE[Math.floor(Math.random() * GENTLE.length)];
      bubble.hidden = false;
      clearTimeout(bubble._t);
      bubble._t = setTimeout(function () { bubble.hidden = true; }, 2600);
    });
  }

  function renderTopics() {
    var el = $("#view-topics");
    if (!el) { return; }
    var counts = countTopics();
    var list = data.topics.filter(function (t) { return topicFilter === "all" || t.pillar === topicFilter; });
    var rows = list.map(function (t) {
      var p = PILLARS[t.pillar] || PILLARS.ideal;
      var st = STATUS[t.status] || STATUS.idea;
      var hasSched = data.schedule.some(function (sc) { return sc.topicId === t.id && !sc.done; });
      return '<li' + (t.id === flashId ? ' class="flash"' : '') + '>' +
        '<div class="li-main"><div class="li-title">' + esc(t.title) + '</div>' +
        '<div class="li-meta"><span class="tag"><span class="swatch ' + p.tone + '"></span>' + p.name + '</span>' +
        '<button class="tag ' + st.cls + '" type="button" data-action="topic-status" data-id="' + t.id + '" title="点一下切换状态">' + st.name + '</button>' +
        (t.source ? '<span>' + esc(t.source) + '</span>' : '') + '</div></div>' +
        '<div class="li-actions">' +
          (hasSched
            ? '<button class="btn tiny" type="button" data-action="topic-unschedule" data-id="' + t.id + '">取消排期</button>'
            : '<button class="btn tiny" type="button" data-action="topic-schedule" data-id="' + t.id + '">排期</button>') +
        '<button class="btn tiny" type="button" data-action="topic-del" data-id="' + t.id + '">删除</button></div></li>';
    }).join("");
    var filters = [["all", "全部"], ["ideal", "理想进度条"], ["weekend", "周末 online"], ["paper", "纸上出走"]].map(function (f) {
      return '<button class="chip' + (topicFilter === f[0] ? " accent" : "") + '" type="button" data-action="filter" data-pillar="' + f[0] + '">' + f[1] + '</button>';
    }).join("");

    el.innerHTML =
      '<div class="band"><div class="band-inner">' +
        '<div class="page-head"><h2>选题库</h2><p>灵感先收进来,再排着队变成笔记。共 ' + data.topics.length + ' 条 · 未发布 ' + (counts.idea + counts.drafting + counts.scheduled) + ' 条</p></div>' +
        '<div class="card"><h3>记一条选题</h3><form data-form="topic">' +
          '<div class="fr"><input class="grow" type="text" name="title" placeholder="想到什么写什么,比如:第一次做义工的三个瞬间" required></div>' +
          '<div class="fr"><select name="pillar" aria-label="归到哪个栏目">' +
            '<option value="ideal">理想进度条</option><option value="weekend">周末 online</option><option value="paper">纸上出走</option>' +
          '</select><button class="btn primary" type="submit">存起来</button></div>' +
        '</form></div>' +
        '<div class="card"><div class="chips">' + filters + '</div>' +
          (rows ? '<ul class="list">' + rows + '</ul>' : '<p class="empty">这个栏目还空着。生活里遇到什么,随手记一条就好。</p>') +
        '</div>' +
      '</div></div>';
    if (flashId) { setTimeout(function () { flashId = ""; }, 400); }
  }

  function renderSchedule() {
    var el = $("#view-schedule");
    if (!el) { return; }
    var items = data.schedule.slice().sort(byDate);
    var open = items.filter(function (s) { return !s.done; });
    var doneList = items.filter(function (s) { return s.done; }).slice(-4).reverse();
    var pend = pendingScheduleTopicId ? findTopic(pendingScheduleTopicId) : null;
    var options = '<option value="">— 从选题库选一条(可不选) —</option>' + data.topics.filter(function (t) { return t.status !== "published"; })
      .map(function (t) { return '<option value="' + t.id + '"' + (pend && pend.id === t.id ? " selected" : "") + ">" + esc(t.title) + "</option>"; }).join("");
    var rows = open.map(function (s) {
      var late = s.date <= todayISO();
      return '<li><div class="li-main"><div class="li-title">' + esc(s.title) + '</div>' +
        '<div class="li-meta"><span class="tag' + (late ? " amber" : "") + '">' + (late ? "已到点" : fmtWD(s.date)) + '</span>' +
        '<span>' + fmtCN(s.date) + " " + esc(s.time) + '</span><span>小红书</span></div></div>' +
        '<div class="li-actions"><button class="btn tiny" type="button" data-action="sched-done" data-id="' + s.id + '">已发 ✓</button>' +
        '<button class="btn tiny" type="button" data-action="sched-postpone" data-id="' + s.id + '">顺延</button>' +
        '<button class="btn tiny" type="button" data-action="sched-del" data-id="' + s.id + '">删除</button></div></li>';
    }).join("");
    var doneRows = doneList.map(function (s) {
      return '<div class="rowline"><div class="rl-main"><div class="rl-title">' + esc(s.title) + '</div>' +
        '<div class="rl-meta">' + fmtCN(s.date) + ' 已发布</div></div></div>';
    }).join("");
    var weekStart = startOfWeekISO();
    var days = "";
    for (var i = 0; i < 7; i += 1) {
      var iso = addDays(weekStart, i);
      var d = parseISO(iso);
      var slots = data.schedule.filter(function (s) { return s.date === iso; }).sort(byDate).map(function (s) {
        return '<div class="slot"><span class="tm">' + esc(s.time) + (s.done ? " · 已发" : "") + '</span>' + esc(s.title) + '</div>';
      }).join("");
      days += '<div class="day' + (iso === todayISO() ? " today" : "") + '"><div class="dn">' + WD[d.getDay()] + '</div><div class="dd">' + fmtShort(iso) + '</div>' + (slots || '<div class="slot" style="color:#c3bbb1">—</div>') + '</div>';
    }
    el.innerHTML =
      '<div class="band"><div class="band-inner">' +
        '<div class="page-head"><h2>内容排期</h2><p>建议节奏:每周 2 篇 · 周三 21:00 / 周日 18:30(可以按你的习惯改)</p></div>' +
        '<div class="card"><h3>本周安排</h3><div class="week">' + days + '</div></div>' +
        '<div class="card"><h3>排一条新内容</h3><form data-form="schedule">' +
          '<div class="fr"><select class="grow" name="topicId" aria-label="从选题库选择">' + options + '</select></div>' +
          '<div class="fr"><input class="grow" type="text" name="title" placeholder="这条内容叫什么" value="' + esc(pend ? pend.title : "") + '" required>' +
          '<input type="date" name="date" value="' + nextWD(3) + '" required aria-label="日期">' +
          '<input type="time" name="time" value="21:00" required aria-label="时间">' +
          '<button class="btn primary" type="submit">排上</button></div>' +
        '</form></div>' +
        '<div class="card"><h3>待发清单</h3>' +
          (rows ? '<ul class="list">' + rows + '</ul>' : '<p class="empty">这周还没有排期。去选题库挑一条,点「排期」。</p>') +
          (doneRows ? '<div style="margin-top:14px"><p class="subtle">最近发出去的</p>' + doneRows + '</div>' : '') +
        '</div>' +
      '</div></div>';
  }

  function renderIdeal() {
    var el = $("#view-ideal");
    if (!el) { return; }
    var cards = data.tracks.map(function (t) {
      var count = trackCount(t);
      var target = trackTarget(t);
      var pct = trackPct(t);
      var all = (t.entries || []).slice().reverse();
      var shown = expanded[t.id] ? all : all.slice(0, 3);
      var rest = all.length - shown.length;
      var entries = shown.map(function (e) {
        return '<div class="entry"><span class="when">' + fmtCN(e.date) + '</span><span class="txt">' + esc(e.text) + '</span>' +
          '<button class="btn tiny" type="button" data-action="track-entry-topic" data-id="' + t.id + '" data-eid="' + e.id + '">变成选题</button>' +
          '<button class="btn tiny" type="button" data-action="track-entry-del" data-id="' + t.id + '" data-eid="' + e.id + '">删除</button></div>';
      }).join("") + (rest > 0 ? '<button class="btn tiny" type="button" data-action="track-toggle" data-id="' + t.id + '">还有 ' + rest + ' 条 · 展开</button>' : '');
      return '<div class="track"><div class="t-head"><div><div class="t-name">' + esc(t.name) + '</div>' +
        '<div class="t-goal">' + esc(t.goal) + '</div></div>' +
        '<div class="t-count"><b>' + count + '</b> 次</div></div>' +
        '<div class="track-progress">' +
          '<span class="bar"><i style="width:' + pct + '%"></i></span>' +
          '<label class="pct-box">目标 <input type="number" min="1" max="999" step="5" value="' + target + '" data-target="' + t.id + '" aria-label="' + esc(t.name) + '的目标次数"> 次</label>' +
        '</div>' +
        '<form data-form="track-entry" data-id="' + t.id + '" class="fr" style="margin-top:10px">' +
          '<input class="grow" type="text" name="text" placeholder="今天推进了什么?一句话就行" required>' +
          '<button class="btn primary" type="submit">记一笔</button></form>' +
        (entries ? '<div style="margin-top:8px">' + entries + '</div>' : '<p class="subtle" style="margin:10px 0 0">还没有记录。学了一课、写了一页,都值得记一笔。</p>') +
      '</div>';
    }).join("");
    el.innerHTML =
      '<div class="band"><div class="band-inner">' +
        '<div class="page-head"><h2>理想进度条</h2><p>五条线,慢慢走。记的是「发生过什么」,不是「应该做什么」。</p></div>' +
        cards +
        '<p class="subtle" style="margin-top:14px">每记一笔就 +1 次,进度条自己会走;记录右边可以「变成选题」—— 一条真实经历,就是一篇好内容。</p>' +
      '</div></div>';
  }

  function renderWeekend() {
    var el = $("#view-weekend");
    if (!el) { return; }
    var items = data.weekend.slice().sort(function (a, b) { return String(b.date).localeCompare(String(a.date)); });
    var rows = items.map(function (w) {
      return '<li><div class="li-main"><div class="li-title">' + esc(w.text) + '</div>' +
        '<div class="li-meta"><span class="tag"><span class="swatch p2"></span>' + esc(w.type) + '</span><span>' + fmtCN(w.date) + " " + fmtWD(w.date) + '</span></div></div>' +
        '<div class="li-actions"><button class="btn tiny" type="button" data-action="weekend-topic" data-id="' + w.id + '">变成选题</button>' +
        '<button class="btn tiny" type="button" data-action="weekend-del" data-id="' + w.id + '">删除</button></div></li>';
    }).join("");
    var types = WEEKEND_TYPES.map(function (t) { return '<option value="' + t + '">' + t + "</option>"; }).join("");
    el.innerHTML =
      '<div class="band"><div class="band-inner">' +
        '<div class="page-head"><h2>周末 online</h2><p>出去走走,回来记一笔。美好记忆先属于你,顺便才是素材。</p></div>' +
        '<div class="card"><h3>记一件事</h3><form data-form="weekend">' +
          '<div class="fr"><input type="date" name="date" value="' + todayISO() + '" required aria-label="日期">' +
          '<select name="type" aria-label="类型">' + types + '</select></div>' +
          '<div class="fr"><input class="grow" type="text" name="text" placeholder="比如:第一次走完鲲鹏径的一段,海边的风把烦恼吹没了" required></div>' +
          '<div class="fr"><button class="btn primary" type="submit">记下</button></div>' +
        '</form></div>' +
        '<div class="card"><h3>这些日子(' + data.weekend.length + ')</h3>' +
          (rows ? '<ul class="list">' + rows + '</ul>' : '<p class="empty">还没有记录。这个周末出去走走,晚上回来记一笔。</p>') +
        '</div>' +
      '</div></div>';
  }

  function renderPaper() {
    var el = $("#view-paper");
    if (!el) { return; }
    var items = data.books.slice().reverse();
    var rows = items.map(function (b) {
      return '<li><div class="li-main"><div class="li-title">《' + esc(b.title) + '》' + (b.author ? ' <span class="subtle">' + esc(b.author) + "</span>" : "") + '</div>' +
        (b.note ? '<div class="li-meta" style="color:var(--ink-2)">' + esc(b.note) + '</div>' : '') +
        '<div class="li-meta"><button class="tag" type="button" data-action="book-status" data-id="' + b.id + '" title="点一下切换状态">' + esc(b.status) + '</button></div></div>' +
        '<div class="li-actions"><button class="btn tiny" type="button" data-action="book-topic" data-id="' + b.id + '">变成书评选题</button>' +
        '<button class="btn tiny" type="button" data-action="book-del" data-id="' + b.id + '">删除</button></div></li>';
    }).join("");
    var statuses = BOOK_STATUS.map(function (s) { return '<option value="' + s + '"' + (s === "在读" ? " selected" : "") + ">" + s + "</option>"; }).join("");
    el.innerHTML =
      '<div class="band"><div class="band-inner">' +
        '<div class="page-head"><h2>纸上出走</h2><p>读到的句子、想通的事,都放这里。读不动的时候,也允许自己停一停。</p></div>' +
        '<div class="card"><h3>放进书架</h3><form data-form="book">' +
          '<div class="fr"><input class="grow" type="text" name="title" placeholder="书名" required>' +
          '<input class="grow" type="text" name="author" placeholder="作者(可不填)">' +
          '<select name="status" aria-label="阅读状态">' + statuses + '</select></div>' +
          '<div class="fr"><input class="grow" type="text" name="note" placeholder="一句短评或摘抄(可不填),比如:平静也是一种野心"></div>' +
          '<div class="fr"><button class="btn primary" type="submit">放上去</button></div>' +
        '</form></div>' +
        '<div class="card"><h3>书架(' + data.books.length + ')</h3>' +
          (rows ? '<ul class="list">' + rows + '</ul>' : '<p class="empty">书架还空着。最近在读什么?放一本进来。</p>') +
        '</div>' +
      '</div></div>';
  }

  function setSlide(i) {
    var slides = document.querySelectorAll("#carousel .slide");
    var dots = document.querySelectorAll("#carousel .dots button");
    if (!slides.length) { return; }
    slideIndex = (i + slides.length) % slides.length;
    Array.prototype.forEach.call(slides, function (s, idx) { s.classList.toggle("is-active", idx === slideIndex); });
    Array.prototype.forEach.call(dots, function (d, idx) { d.classList.toggle("is-active", idx === slideIndex); });
  }

  document.addEventListener("click", function (event) {
    var target = event.target.closest ? event.target.closest("[data-view],[data-view-btn],[data-action]") : null;
    if (!target) { return; }
    if (target.getAttribute("data-view")) { go(target.getAttribute("data-view")); return; }
    if (target.getAttribute("data-view-btn")) { go(target.getAttribute("data-view-btn")); return; }
    var action = target.getAttribute("data-action");
    var id = target.getAttribute("data-id");
    if (action === "slide-prev") { setSlide(slideIndex - 1); return; }
    if (action === "slide-next") { setSlide(slideIndex + 1); return; }
    if (action === "slide-go") { setSlide(Number(target.getAttribute("data-index"))); return; }
    if (action === "qr") { openQr(); return; }
    if (action === "cf-cancel") { var cm = $("#cfModal"); if (cm) { cm.hidden = true; } CF.fn = null; return; }
    if (action === "cf-ok") { var cf = CF.fn; var cm2 = $("#cfModal"); if (cm2) { cm2.hidden = true; } CF.fn = null; if (cf) { cf(); } return; }
    if (action === "qr-close") { var qm = $("#qrModal"); if (qm) { qm.hidden = true; } return; }
    if (action === "export") {
      var blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
      var url = URL.createObjectURL(blob);
      var link = document.createElement("a");
      link.href = url; link.download = "成长工作台备份-" + todayISO() + ".json";
      document.body.appendChild(link); link.click(); link.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
      toast("备份已导出");
      return;
    }
    if (action === "import") { var fi = $("#importFile"); if (fi) { fi.click(); } return; }
    if (action === "filter") { topicFilter = target.getAttribute("data-pillar"); renderTopics(); return; }
    if (action === "topic-status") {
      var t = findTopic(id); if (!t) { return; }
      t.status = STATUS_ORDER[(STATUS_ORDER.indexOf(t.status) + 1) % STATUS_ORDER.length];
      save(); refresh(); toast("状态改成「" + STATUS[t.status].name + "」"); return;
    }
    if (action === "topic-del") {
      askConfirm("删除这条选题?", function () {
        data.topics = data.topics.filter(function (x) { return x.id !== id; });
        save(); refresh(); toast("删掉了");
      });
      return;
    }
    if (action === "topic-unschedule") {
      askConfirm("取消这条排期?", function () {
        data.schedule = data.schedule.filter(function (x) { return x.topicId !== id; });
        var tt = findTopic(id);
        if (tt && tt.status === "scheduled") { tt.status = "idea"; }
        save(); refresh(); toast("已取消排期");
      });
      return;
    }
    if (action === "topic-schedule") { pendingScheduleTopicId = id; go("schedule"); renderSchedule(); toast("标题已经带过去,补一下时间就行"); return; }
    if (action === "sched-done") {
      var s = findSchedule(id); if (!s) { return; }
      s.done = true;
      if (s.topicId) { var t3 = findTopic(s.topicId); if (t3) { t3.status = "published"; } }
      save(); refresh(); toast("发出去啦"); return;
    }
    if (action === "sched-postpone") {
      var s2 = findSchedule(id); if (!s2) { return; }
      s2.date = addDays(s2.date, 1); save(); refresh(); toast("顺延到 " + fmtCN(s2.date)); return;
    }
    if (action === "sched-del") {
      askConfirm("删掉这条排期?", function () {
        data.schedule = data.schedule.filter(function (x) { return x.id !== id; });
        save(); refresh(); toast("排期已删掉");
      });
      return;
    }
    if (action === "track-entry-del") {
      var tr0 = findTrack(id);
      var eid0 = target.getAttribute("data-eid");
      askConfirm("删除这条记录?", function () {
        if (!tr0) { return; }
        tr0.entries = tr0.entries.filter(function (x) { return x.id !== eid0; });
        save(); refresh(); toast("删掉了");
      });
      return;
    }
    if (action === "track-toggle") {
      expanded[id] = !expanded[id];
      renderIdeal();
      return;
    }
    if (action === "track-entry-topic") {
      var tr = findTrack(id); if (!tr) { return; }
      var eid = target.getAttribute("data-eid");
      var entry = null;
      tr.entries.forEach(function (e) { if (e.id === eid) { entry = e; } });
      if (!entry) { return; }
      addTopic("「" + tr.name + "」进展:" + entry.text, "ideal", "来自理想进度条 · " + fmtCN(entry.date));
      topicFilter = "all"; save(); go("topics"); refresh(); toast("已放进选题库"); return;
    }
    if (action === "weekend-topic") {
      var w = findWeekend(id); if (!w) { return; }
      addTopic(w.type + "小记｜" + w.text, "weekend", "来自周末记录 " + fmtCN(w.date));
      topicFilter = "all"; save(); go("topics"); refresh(); toast("已放进选题库"); return;
    }
    if (action === "weekend-del") {
      askConfirm("删掉这条记录?", function () {
        data.weekend = data.weekend.filter(function (x) { return x.id !== id; });
        save(); refresh(); toast("删掉了");
      });
      return;
    }
    if (action === "book-status") {
      var b = findBook(id); if (!b) { return; }
      b.status = BOOK_STATUS[(BOOK_STATUS.indexOf(b.status) + 1) % BOOK_STATUS.length];
      save(); refresh(); return;
    }
    if (action === "book-topic") {
      var b2 = findBook(id); if (!b2) { return; }
      var note = b2.note ? b2.note.slice(0, 24) : "我想聊聊这本书";
      addTopic("《" + b2.title + "》书评:" + note, "paper", "来自纸上出走");
      topicFilter = "all"; save(); go("topics"); refresh(); toast("书评选题建好了"); return;
    }
    if (action === "book-del") {
      askConfirm("把这本书从书架拿下来?", function () {
        data.books = data.books.filter(function (x) { return x.id !== id; });
        save(); refresh(); toast("删掉了");
      });
      return;
    }
  });

  document.addEventListener("submit", function (event) {
    var form = event.target.closest ? event.target.closest("form[data-form]") : null;
    if (!form) { return; }
    event.preventDefault();
    var fd = new FormData(form);
    var kind = form.getAttribute("data-form");
    if (kind === "topic") {
      var title = String(fd.get("title") || "").trim();
      if (!title) { return; }
      addTopic(title, String(fd.get("pillar") || "ideal"), "");
      topicFilter = "all"; save(); refresh(); toast("存好了"); return;
    }
    if (kind === "schedule") {
      var stitle = String(fd.get("title") || "").trim();
      var sdate = String(fd.get("date") || "");
      var stime = String(fd.get("time") || "21:00");
      var topicId = String(fd.get("topicId") || "");
      if (!stitle || !sdate) { toast("标题和日期要填上"); return; }
      data.schedule.push({ id: uid("s"), topicId: topicId, title: stitle, date: sdate, time: stime, done: false });
      if (topicId) { var t4 = findTopic(topicId); if (t4) { t4.status = "scheduled"; } }
      pendingScheduleTopicId = "";
      save(); refresh(); toast("排好了:" + fmtCN(sdate) + " " + stime); return;
    }
    if (kind === "track-entry") {
      var tr = findTrack(form.getAttribute("data-id"));
      var text = String(fd.get("text") || "").trim();
      if (!tr || !text) { return; }
      tr.entries.push({ id: uid("e"), date: todayISO(), text: text });
      save(); refresh(); toast("记下了 · " + tr.name); return;
    }
    if (kind === "weekend") {
      var wtext = String(fd.get("text") || "").trim();
      if (!wtext) { return; }
      data.weekend.push({ id: uid("w"), date: String(fd.get("date") || todayISO()), type: String(fd.get("type") || "其他"), text: wtext });
      save(); refresh(); toast("记下了,这段日子不会丢"); return;
    }
    if (kind === "book") {
      var btitle = String(fd.get("title") || "").trim();
      if (!btitle) { return; }
      data.books.push({
        id: uid("b"), title: btitle,
        author: String(fd.get("author") || "").trim(),
        status: String(fd.get("status") || "在读"),
        note: String(fd.get("note") || "").trim()
      });
      save(); refresh(); toast("放上书架了"); return;
    }
  });

  document.addEventListener("input", function (event) {
    var tgt = event.target.closest ? event.target.closest("input[data-target]") : null;
    if (!tgt) { return; }
    var tk = findTrack(tgt.getAttribute("data-target"));
    if (!tk) { return; }
    var val = Math.max(1, Math.min(999, Number(tgt.value) || 1));
    tk.target = val;
    var wrap = tgt.closest(".track-progress");
    if (wrap) {
      var fill = wrap.querySelector(".bar > i");
      if (fill) {
        var cnt = trackCount(tk);
        fill.style.width = Math.max(0, Math.min(100, Math.round(cnt / val * 100))) + "%";
      }
    }
    save();
  });

  document.addEventListener("change", function (event) {
    var sel = event.target.closest ? event.target.closest('form[data-form="schedule"] select[name="topicId"]') : null;
    if (sel) {
      var t = findTopic(sel.value);
      if (t && sel.form) {
        var input = sel.form.querySelector('input[name="title"]');
        if (input) { input.value = t.title; }
      }
      return;
    }
    var tgt = event.target.closest ? event.target.closest("input[data-target]") : null;
    if (tgt) {
      var tk = findTrack(tgt.getAttribute("data-target"));
      if (tk) {
        tk.target = Math.max(1, Math.min(999, Number(tgt.value) || 1));
        save();
        renderIdeal();
        if (currentView === "today") { renderToday(); }
      }
      return;
    }
  });



  var CF = { fn: null };
  function askConfirm(text, fn) {
    CF.fn = fn;
    var m = $("#cfModal");
    if (!m) { if (fn) { fn(); } return; }
    $("#cfText").textContent = text;
    m.hidden = false;
  }

  function openQr() {
    var modal = $("#qrModal");
    if (!modal) { return; }
    modal.hidden = false;
    var box = $("#qrTarget");
    box.innerHTML = '<p class="subtle">正在生成二维码…</p>';
    if (SYNC.mode === "server") {
      fetch("./api/info", { cache: "no-store" }).then(function (r) { return r.json(); }).then(function (j) {
        paintQr((j && j.ok && j.lan) ? j.lan : (location.origin + location.pathname));
      }).catch(function () {
        paintQr(location.origin + location.pathname);
      });
    } else {
      paintQr(location.href);
    }
  }

  function paintQr(url) {
    var box = $("#qrTarget");
    $("#qrUrl").textContent = url;
    function paint() {
      if (!window.QRCode) {
        box.innerHTML = '<p class="subtle">二维码没加载出来,在手机浏览器里输入上面的网址也行。</p>';
        return;
      }
      box.innerHTML = "";
      new window.QRCode(box, { text: url, width: 220, height: 220, correctLevel: window.QRCode.CorrectLevel.M });
    }
    if (box.querySelector("img") || box.querySelector("canvas")) { return; }
    if (window.QRCode) { paint(); return; }
    var sc = document.createElement("script");
    sc.src = "https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js";
    sc.onload = paint;
    sc.onerror = paint;
    document.head.appendChild(sc);
  }

  var importInput = $("#importFile");
  if (importInput) {
    importInput.addEventListener("change", function () {
      var file = importInput.files && importInput.files[0];
      if (!file) { return; }
      var reader = new FileReader();
      reader.onload = function () {
        try {
          var parsed = JSON.parse(String(reader.result));
          if (!parsed || parsed.version !== 1 || !Array.isArray(parsed.topics)) { throw new Error("这个文件里没有工作台数据"); }
          data = parsed;
          save(); refresh(); go("today");
          toast("备份已导入");
        } catch (err) { toast("导入失败:" + err.message); }
        importInput.value = "";
      };
      reader.readAsText(file);
    });
  }

  if (PREVIEW) {
    var strip = $("#previewStrip");
    if (strip) { strip.hidden = false; }
  }

  migrate();
  refresh();
  go("today");
  renderSyncNote();
  initSync();
})();
</script>
</body>
</html>
